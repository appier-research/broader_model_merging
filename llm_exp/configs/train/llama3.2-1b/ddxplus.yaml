## Axolotl full fine-tuning: meta-llama/Llama-3.2-1B-Instruct on ddxplus.
## Run from llm_exp/: axolotl train configs/train/llama3.2-1b/ddxplus.yaml
## Reconstructed: no original config survives for this run; derived from the
## qwen3-0.6b/1.7b configs with the same recipe (lr 4e-5, effective batch 36, 6 epochs).

base_model: meta-llama/Llama-3.2-1B-Instruct

# Dataset configuration: chat messages in OpenAI-like format
datasets:
  - path: theblackcat102/ddxplus_m
    type: chat_template
    # step 1: template selection
    chat_template: tokenizer_default_fallback_chatml
    # step 2: dataset field mappings
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    # Role normalization (map custom roles to those used by the template)
    roles:
      assistant:
        - assistant
        - gpt
        - model
      user:
        - user
        - human
      system:
        - system
    # step 3: masking (train only on assistant turns)
    roles_to_train: ["assistant"]
    train_on_eos: "turn"

# Training configuration
output_dir: ./checkpoints/task_vectors/ddxplus_llama3.2-1b
sequence_len: 8192
sample_packing: false
flash_attention: true
gradient_accumulation_steps: 36
micro_batch_size: 1
num_epochs: 6

# Optimizer and scheduler
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 4.0e-5
warmup_ratio: 0.1
weight_decay: 0.0

# Precision and performance
bf16: true
tf32: false
gradient_checkpointing: true

# Logging and checkpointing
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 5

# Special tokens: Llama-3.2-Instruct's own template already ends turns with
# <|eot_id|> (its eos); it has no pad token, so reuse an existing reserved one.
special_tokens:
  pad_token: "<|finetune_right_pad_id|>"

# Optional: set a validation split size (we already have a separate valid file for analysis)
val_set_size: 0.0

# Weights & Biases (optional)
wandb_project: model_merge_llm
wandb_entity: <YOUR_WANDB_ENTITY>
wandb_watch:
wandb_name: llama3.2-1b-instruct-ddxplus_lr4e-5_bs36_e6
wandb_log_model: 
